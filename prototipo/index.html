<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>LegDay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: app de gestión. Barra superior + navegación lateral (horizontal en celular). Tipografía condensada de gimnasio para títulos y cifras. */
:root{
  --bg:#F4F3F7; --surface:#FFFFFF; --surface-2:#F9F8FB; --ink:#1C1726; --muted:#675F74; --line:#E2DFE9;
  --accent:#D92F55; --accent-ink:#FFFFFF; --accent-soft:#FBE4EA;
  --ok:#17784F; --ok-soft:#DFF3EA; --warn:#9A6205; --warn-soft:#FBEFD6; --bad:#B42323; --bad-soft:#FBE1E1;
  --wa:#E1F6D9; --wa-ink:#173B22;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F15; --surface:#1A171F; --surface-2:#211D27; --ink:#F1EEF5; --muted:#A69FB2; --line:#2E2936;
  --accent:#FF5779; --accent-ink:#1A0A10; --accent-soft:#3A1622;
  --ok:#5BD39E; --ok-soft:#14301F; --warn:#F2B857; --warn-soft:#33270E; --bad:#FF7B7B; --bad-soft:#3A1717;
  --wa:#1C3424; --wa-ink:#D7F2DE; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#110F15; --surface:#1A171F; --surface-2:#211D27; --ink:#F1EEF5; --muted:#A69FB2; --line:#2E2936;
  --accent:#FF5779; --accent-ink:#1A0A10; --accent-soft:#3A1622;
  --ok:#5BD39E; --ok-soft:#14301F; --warn:#F2B857; --warn-soft:#33270E; --bad:#FF7B7B; --bad-soft:#3A1717;
  --wa:#1C3424; --wa-ink:#D7F2DE; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* brand */
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.02em;display:flex;align-items:baseline;gap:0;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:800}
.brand i{display:inline-block;width:.35em;height:.8em;background:var(--accent);transform:skewX(-18deg);margin:0 .12em}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .9rem;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn.icon{padding:.25rem .55rem;color:var(--muted)}
.btn.icon:hover{color:var(--bad);border-color:var(--bad)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .65rem;min-width:0}
textarea.input{resize:vertical;min-height:4.2rem}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;align-items:end}
.check{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface);font-size:.88rem}
.check input{accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:.45rem}

/* pills */
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.new{background:var(--accent-soft);color:var(--accent)}

/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding-block:2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:100%;max-width:420px;display:flex;flex-direction:column;gap:1.4rem}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:flex;flex-direction:column;gap:1rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:.55rem;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.demo-note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--accent);padding:.2rem 0 .2rem .7rem}
.demo-note code{font-family:ui-monospace,Menlo,monospace;background:var(--surface-2);padding:0 .3rem;border-radius:4px;color:var(--ink)}
.err{color:var(--bad);font-size:.88rem;font-weight:500}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.65rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.who{display:flex;align-items:center;gap:.6rem;font-size:.88rem;color:var(--muted);min-width:0}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1280px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:2px;padding:1.2rem .8rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start}
.side button{text-align:left;border:0;background:transparent;padding:.6rem .8rem;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.side button:hover{background:var(--surface);color:var(--ink)}
.side button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.side .count{background:var(--accent);color:var(--accent-ink);font-size:.72rem;border-radius:999px;padding:0 .45rem;font-variant-numeric:tabular-nums}
.main{padding-block:1.4rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.page-head p{margin-top:.3rem}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;position:static;padding:.6rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
  .side button{white-space:nowrap}
  .side button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent);background:var(--surface-2)}
}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.2rem}
.kpi .v{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.65rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.empty{color:var(--muted);font-size:.9rem;padding:.4rem 0}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -.2rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:.78rem;color:var(--muted);font-weight:700;padding:.5rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.edit-tbl td{padding:.35rem .3rem}
.edit-tbl .input{padding:.4rem .5rem}
.edit-tbl .w-s{width:70px}
.edit-tbl .w-m{width:95px}

/* tabs */
.tabs{display:flex;gap:.35rem;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.4rem .8rem;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* calendar */
.week{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:.6rem;overflow-x:auto;padding-bottom:.3rem}
.day{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;display:flex;flex-direction:column;gap:.5rem;min-height:150px}
.day.today{border-color:var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .55rem;display:flex;flex-direction:column;gap:.15rem;position:relative}
.slot .tm{font-family:var(--f-display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.slot .ti{font-weight:600;font-size:.88rem;line-height:1.3}
.slot .wh{font-size:.76rem;color:var(--muted)}
.slot .x{position:absolute;top:.3rem;right:.3rem;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:.15rem .3rem;border-radius:4px}
.slot .x:hover{color:var(--bad);background:var(--bad-soft)}

/* meals */
.meal{display:grid;grid-template-columns:150px 90px minmax(0,1fr) auto;gap:.6rem;align-items:start;padding:.7rem 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
@media (max-width:640px){.meal{grid-template-columns:1fr 90px auto}.meal textarea{grid-column:1 / -1}}

/* whatsapp log */
.wa-log{display:flex;flex-direction:column;gap:.6rem}
.wa{background:var(--wa);color:var(--wa-ink);border-radius:10px 10px 10px 2px;padding:.6rem .75rem;max-width:560px;display:flex;flex-direction:column;gap:.25rem}
.wa .meta{display:flex;justify-content:space-between;gap:.8rem;font-size:.74rem;opacity:.75;flex-wrap:wrap}
.wa .txt{white-space:pre-wrap;font-size:.9rem}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* chart */
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .bar{fill:var(--accent-soft)}
.chart .bar.cur{fill:var(--accent)}
.chart .val{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}

/* student */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.3rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2rem;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}}
.pdf-box{display:flex;flex-direction:column;gap:.5rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.pdf-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.daycard-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.8rem 1rem;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;padding:.65rem 1rem;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .n{font-weight:600}
.ex .sr{font-family:var(--f-display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.ex .nt{grid-column:1 / -1;font-size:.82rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1rem}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px);font-size:.9rem}
/* biblioteca de ejercicios */
.search-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.search-row .input{max-width:320px}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.9rem}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.ex-card:hover{border-color:var(--accent)}
.ex-card .thumb{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;border-bottom:1px solid var(--line);max-width:100%}
.ex-card .thumb canvas,.ex-card .thumb video,.ex-card .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ex-card .body{padding:.65rem .75rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.ex-card .nm{font-weight:600;line-height:1.3}
.zone{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;color:var(--accent)}
.pending{font-size:.78rem;color:var(--muted);padding:1rem;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,14,.55);z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:820px;max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:700px){.modal{grid-template-columns:minmax(0,1fr)}}
.modal .stage{background:var(--surface-2);display:flex;flex-direction:column;gap:.5rem;padding:1rem;border-right:1px solid var(--line)}
.modal .stage .anim{aspect-ratio:1/1;width:100%;display:grid;place-items:center}
.modal .stage canvas,.modal .stage video,.modal .stage img{width:100%;height:100%;object-fit:contain;display:block}
.modal .info{padding:1.2rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.45rem}
.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.mistakes{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.3rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.fact{background:var(--surface-2);border-radius:8px;padding:.5rem .65rem;display:flex;flex-direction:column;gap:.1rem}
.fact b{font-weight:600}
.media-prev{width:140px;aspect-ratio:1/1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center}
.media-prev canvas,.media-prev video,.media-prev img{width:100%;height:100%;object-fit:contain}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:.82rem;text-decoration:underline;text-underline-offset:2px}
.banner{font-size:.82rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:.5rem .8rem}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
</style>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== Utilidades ===================== */
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
// Feriados nacionales (no cuentan como días hábiles). En la versión final se cargan desde la configuración.
const HOLIDAYS=new Set(['2026-12-08','2026-12-25','2027-01-01']);
const ZONES=['Glúteos','Cuádriceps','Femorales','Aductores y abductores','Espalda','Hombros','Pecho','Brazos','Core'];
const LEVELS=['Principiante','Intermedio','Avanzado'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const fmtDate=s=>{const d=parse(s);return `${d.getDate()} ${MONTHS[d.getMonth()]}`};
const fmtDateLong=s=>{const d=parse(s);const wd=['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()];return `${wd} ${d.getDate()} ${MONTHS[d.getMonth()]}`};
const isBusiness=d=>d.getDay()!==0&&d.getDay()!==6&&!HOLIDAYS.has(iso(d));
function subBusinessDays(s,n){const d=parse(s);while(n>0){d.setDate(d.getDate()-1);if(isBusiness(d))n--;}return iso(d)}
const reminderDate=due=>subBusinessDays(due,2);
function addMonth(s){const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
const monthKey=s=>s.slice(0,7);
const monthLabel=k=>{const [y,m]=k.split('-');return `${MONTHS_L[+m-1]} ${y}`};
const nowStamp=()=>{const d=new Date();return `${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const first=n=>n.split(' ')[0];
const todayDayName=()=>{const g=new Date().getDay();return g===0?null:DAYS[g-1]};
const daysSince=s=>s?Math.floor((new Date()-parse(s.slice(0,10)))/864e5):999;

/* ===================== Biblioteca de ejercicios (ejemplo) ===================== */
function seedExercises(){
  const E=(id,name,zone,muscles,equipment,level,anim,steps,mistakes)=>({id,name,zone,muscles,equipment,level,anim,media:null,steps,mistakes});
  return [
    E('e1','Hip thrust con barra','Glúteos','Glúteo mayor, femorales','Barra, banco','Intermedio','hipthrust',

async function offerFile(filename,data){
  if(!window.claude){ // fuera de claude.ai (por ejemplo, Live Preview de VS Code): descarga directa
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/csv'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Archivo descargado: '+filename);return}
  if(!downloadsNS){toast('La descarga no está disponible en esta vista del prototipo. En la web final se descarga directo.');return}
  try{await downloadsNS.save({filename,data});toast('Archivo descargado: '+filename)}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Esperá un momento y probá de nuevo.');return}toast('No se pudo descargar el archivo.')}
}

  const pt=n=>{const a=P.A[n],b=P.B[n]||a;if(!a)return null;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]};
  const path=(names,color,w)=>{const ps=names.map(pt).filter(Boolean);if(ps.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...ps[0]);ps.slice(1).forEach(q=>ctx.lineTo(...q));ctx.stroke()};
  ctx.clearRect(0,0,220,220);
  ctx.strokeStyle=ln;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,201);ctx.lineTo(212,201);ctx.stroke();
  if(P.bench){const[x,y,w,h]=P.bench;ctx.fillStyle=ln;ctx.fillRect(x,y,w,h);ctx.fillRect(x+6,y+h,5,201-y-h);ctx.fillRect(x+w-11,y+h,5,201-y-h)}
  if(P.A.k2)path(['p','k2','a2','t2'],mu,7);
  path(['p','k','a','t'],ink,8);path(['n','p'],ink,9);path(['n','e','w'],ink,6);
  const h=pt('h');ctx.fillStyle=ink;ctx.beginPath();ctx.arc(h[0],h[1],11,0,Math.PI*2);ctx.fill();
  if(P.bar){const b=pt(P.bar);ctx.fillStyle=ac;ctx.beginPath();ctx.arc(b[0],b[1],13,0,Math.PI*2);ctx.fill();ctx.fillStyle=tok('--surface');ctx.beginPath();ctx.arc(b[0],b[1],3,0,Math.PI*2);ctx.fill()}
  if(P.plate){const b=pt(P.plate);ctx.fillStyle=ac;ctx.beginPath();ctx.arc(b[0],b[1]-14,15,0,Math.PI*2);ctx.fill();ctx.fillStyle=tok('--surface');ctx.beginPath();ctx.arc(b[0],b[1]-14,3,0,Math.PI*2);ctx.fill()}
  if(P.db){const b=pt(P.db);ctx.fillStyle=ac;ctx.fillRect(b[0]-9,b[1]-4,18,8);ctx.fillRect(b[0]-11,b[1]-7,5,14);ctx.fillRect(b[0]+6,b[1]-7,5,14)}
}
// Ciclo: pausa en A, baja a B, pausa en B, vuelve. 2,6 s por repetición.
function phase(x){const e=v=>(1-Math.cos(Math.PI*v))/2;if(x<.15)return 0;if(x<.5)return e((x-.15)/.35);if(x<.65)return 1;return 1-e((x-.65)/.35)}
let anim={raf:0,canvas:null,key:null,playing:false,t0:0,paused:0};
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animStart(canvas,key){animStop();anim={raf:0,canvas,key,playing:!reduceMotion(),t0:performance.now(),paused:0.5};drawFigure(canvas,key,phase(0.5));if(anim.playing)loop()}
function loop(){anim.raf=requestAnimationFrame(now=>{if(!anim.canvas||!anim.canvas.isConnected)return;const x=((now-anim.t0)/2600)%1;anim.paused=x;drawFigure(anim.canvas,anim.key,phase(x));if(anim.playing)loop()})}
function animToggle(){if(!anim.canvas)return;anim.playing=!anim.playing;if(anim.playing){anim.t0=performance.now()-anim.paused*2600;loop()}else cancelAnimationFrame(anim.raf)}
function animStop(){cancelAnimationFrame(anim.raf);anim.canvas=null}
function drawThumbs(){document.querySelectorAll('canvas[data-fig]').forEach(c=>drawFigure(c,c.dataset.fig,1))}
const findEx=name=>state.exercises.find(x=>x.name.trim().toLowerCase()===String(name||'').trim().toLowerCase());
function mediaHTML(ex,thumb){
  if(ex.media){return ex.media.type==='video'?`<video src="${esc(ex.media.src)}" ${thumb?'':'controls'} autoplay loop muted playsinline aria-label="Animación de ${esc(ex.name)}"></video>`:`<img src="${esc(ex.media.src)}" alt="Animación de ${esc(ex.name)}">`}
  if(ex.anim&&POSES[ex.anim])return `<canvas ${thumb?`data-fig="${ex.anim}"`:'id="fig-stage"'} role="img" aria-label="Figura realizando ${esc(ex.name)}"></canvas>`;
  return `<p class="pending">Animación pendiente</p>`;
}

function monthsBack(k,n){const [y,m]=k.split('-').map(Number);const out=[];for(let i=n-1;i>=0;i--){const d=new Date(y,m-1-i,1);out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}return out}
function chart(k){
  const ms=monthsBack(k,6),vals=ms.map(x=>paidInMonth(x).reduce((a,p)=>a+p.amount,0));
  const max=Math.max(...vals,1),W=560,H=200,top=24,bot=26,bw=56,gap=(W-ms.length*bw)/(ms.length+1);
  const h=v=>(H-top-bot)*v/max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cobrado por mes, últimos 6 meses">
    <line class="grid" x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}"/>
    ${ms.map((x,i)=>{const X=gap+i*(bw+gap),bh=h(vals[i]),Y=H-bot-bh;
      return `<rect class="bar ${x===k?'cur':''}" x="${X}" y="${Y}" width="${bw}" height="${Math.max(bh,1)}" rx="4"/>
      <text class="val" x="${X+bw/2}" y="${Y-6}" text-anchor="middle">${vals[i]?'$'+Math.round(vals[i]/1000)+'k':'—'}</text>
      <text x="${X+bw/2}" y="${H-8}" text-anchor="middle">${MONTHS[+x.slice(5)-1]}</text>`}).join('')}</svg>`;
}

  switch(a){
    case 'role':ui.loginRole=v;ui.loginErr='';break;
    case 'logout':closeExercise();session=null;ui.rdraft=ui.ddraft=null;break;
    case 'nav':ui.view=v;ui.editing=null;ui.showNew=false;ui.exEdit=null;ui.exNew=false;break;
    case 'snav':ui.sview=v;break;
    case 'new-student':ui.showNew=true;ui.editing=null;break;
    case 'edit-student':ui.editing=id;ui.showNew=false;break;
    case 'cancel-edit':ui.editing=null;ui.showNew=false;break;
    case 'slot-del':{const c=state.slots.find(x=>x.id===id);state.slots=state.slots.filter(x=>x.id!==id);const ids=c.all?active().map(s=>s.id):c.students;notifyUpdate(ids,'calendario');save();toast(`Horario quitado. Aviso enviado a ${ids.length} ${ids.length===1?'alumna':'alumnas'}.`);break}
    case 'rday':ui.rDay=i;break;
    case 'rday-del':ui.rdraft.days.splice(ui.rDay,1);ui.rDay=0;break;
    case 'ex-add':ui.rdraft.days[ui.rDay].exercises.push({name:'',sets:'3',reps:'12',rest:'60 s',notes:''});break;
    case 'ex-del':ui.rdraft.days[ui.rDay].exercises.splice(i,1);break;
    case 'r-discard':ui.rdraft=null;toast('Cambios descartados.');break;
    case 'r-save':{const ids=[ui.rStudent,...[...document.querySelectorAll('[data-apply="ra"]:checked')].map(x=>x.value)];
      const data=clone(ui.rdraft);delete data._for;data.days.forEach(d=>d.exercises=d.exercises.filter(x=>x.name.trim()));
      ids.forEach(id=>state.routines[id]=clone(data));notifyUpdate(ids,'rutina');save();ui.rdraft=null;
      toast(`Rutina guardada. WhatsApp enviado a ${ids.map(x=>first(stu(x).name)).join(', ')}.`);break}
    case 'meal-add':ui.ddraft.meals.push({name:'Colación',time:'11:00',items:''});break;
    case 'meal-del':ui.ddraft.meals.splice(i,1);break;
    case 'd-discard':ui.ddraft=null;toast('Cambios descartados.');break;
    case 'd-save':{const ids=[ui.dStudent,...[...document.querySelectorAll('[data-apply="da"]:checked')].map(x=>x.value)];
      const data=clone(ui.ddraft);delete data._for;data.meals.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      ids.forEach(id=>state.diets[id]=clone(data));notifyUpdate(ids,'dieta');save();ui.ddraft=null;
      toast(`Dieta guardada. WhatsApp enviado a ${ids.map(x=>first(stu(x).name)).join(', ')}.`);break}
    case 'pay-del':state.payments=state.payments.filter(p=>p.id!==id);save();toast('Pago borrado. Revisá el vencimiento de la alumna si hace falta.');break;
    case 'run-rem':{const n=runReminders();toast(n?`Se enviaron ${n} recordatorios.`:'No hay recordatorios pendientes para hoy.');break}
    case 'csv':{const k=ui.gMonth;const rows=[['Fecha','Alumna','Medio','Monto']].concat(paidInMonth(k).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[p.date,stu(p.studentId)?.name||'',p.method,p.amount]));
      const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');offerFile(`LegDay-pagos-${k}.csv`,csv);return}
    case 'pdf':downloadPdf(v);return;
    case 'ex-open':openExercise(id);return;
    case 'ex-close':closeExercise();return;
    case 'ex-close-bg':if(e.target===b)closeExercise();return;
    case 'fig-toggle':animToggle();b.textContent=anim.playing?'Pausar':'Reproducir';return;
    case 'ex-zone':ui.exZone=v;break;
    case 'exl-new':ui.exNew=true;ui.exEdit=null;ui.exMedia=undefined;break;
    case 'exl-edit':ui.exEdit=id;ui.exNew=false;ui.exMedia=undefined;break;
    case 'exl-cancel':ui.exEdit=null;ui.exNew=false;ui.exMedia=undefined;break;
    case 'ex-media-clear':ui.exMedia=null;break;
    case 'exl-del':{const x=state.exercises.find(y=>y.id===id);if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='¿Borrar?';b.setAttribute('aria-label','Confirmar borrado de '+x.name);setTimeout(()=>{if(b.isConnected){b.dataset.confirm='';b.textContent='×'}},3000);return}
      state.exercises=state.exercises.filter(y=>y.id!==id);save();toast(`"${x.name}" se quitó de la biblioteca.`);break}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.change;if(!c)return;
  if(c==='rAddDay'){if(!e.target.value)return;ui.rdraft.days.push({day:e.target.value,focus:'',exercises:[]});ui.rdraft.days.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day));ui.rDay=ui.rdraft.days.findIndex(d=>d.day===e.target.value)}
  else ui[c]=e.target.value;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-bg'))closeExercise()});
document.addEventListener('change',e=>{
  if(e.target.id!=='exf-file')return;const f=e.target.files[0];if(!f)return;
  if(f.size>3*1024*1024){toast('En el prototipo el archivo puede pesar hasta 3 MB. En la web final el límite es mucho mayor.');e.target.value='';return}
  const r=new FileReader();r.onload=()=>{
    const form=e.target.closest('form');const keep={};form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>keep[el.id]=el.value);
    ui.exMedia={type:f.type.startsWith('video')?'video':'image',src:r.result};render();
    Object.entries(keep).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v})};
  r.readAsDataURL(f);
});
window.addEventListener('resize',()=>{clearTimeout(window.__rs);window.__rs=setTimeout(drawThumbs,150)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ex-search'){ui.exQuery=t.value;applyExFilter();return}
  if(t.dataset.r!==undefined&&ui.rdraft){const d=ui.rdraft.days[ui.rDay];if(t.dataset.r==='focus')d.focus=t.value;else{const [i,f]=t.dataset.r.split('.');d.exercises[+i][f]=t.value}}
  if(t.dataset.d!==undefined&&ui.ddraft){const p=t.dataset.d.split('.');if(p[0]==='m')ui.ddraft.meals[+p[1]][p[2]]=t.value;else ui.ddraft[p[0]]=t.value}
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  const fd=new FormData(f);
  if(k==='login'){
    const u=fd.get('user').trim().toLowerCase(),p=fd.get('pass');
    if(ui.loginRole==='entrenadora'){if(u===state.admin.user&&p===state.admin.pass){session={role:'admin'};ui.view='inicio';ui.loginErr='';if(autoSent)setTimeout(()=>toast(`Se enviaron ${autoSent} recordatorios de cuota automáticamente hoy.`),300)}else ui.loginErr='Usuario o contraseña incorrectos.'}
    else{const s=state.students.find(x=>x.user===u&&x.pass===p);
      if(!s)ui.loginErr='Usuario o contraseña incorrectos.';else if(!s.active)ui.loginErr='Tu acceso está pausado. Escribile a tu entrenadora para reactivarlo.';else{session={role:'student',id:s.id};ui.sview='semana';ui.loginErr=''}}
  }
  if(k==='student'){
    const id=f.dataset.id,user=fd.get('user').trim().toLowerCase();
    if(state.students.some(s=>s.user===user&&s.id!==id)){toast('Ese usuario ya existe. Elegí otro.');return}
    const data={name:fd.get('name').trim(),user,pass:fd.get('pass'),phone:fd.get('phone').trim(),plan:fd.get('plan').trim(),fee:+fd.get('fee'),nextDue:fd.get('nextDue'),active:fd.get('active')==='on'};
    if(id){const s=stu(id);if(s.nextDue!==data.nextDue)s.reminderSentFor=null;Object.assign(s,data);toast('Datos de la alumna guardados.')}
    else{const nidv=nid('s');const t=nowStamp();state.students.push({id:nidv,...data,reminderSentFor:null,updated:{rutina:t,dieta:t,calendario:t}});
      const anyR=state.routines[active()[0]?.id];state.routines[nidv]=anyR?clone(anyR):{days:[]};state.diets[nidv]={kcal:'',protein:'',notes:'',meals:[]};
      sendWA(nidv,'bienvenida',`Hola ${first(data.name)}! Bienvenida a LegDay 💪 Tu usuario es "${user}". Entrá a legday.com.ar para ver tu rutina, tu dieta y tus horarios.`);
      toast('Alumna creada. Le enviamos sus datos de acceso por WhatsApp.')}
    ui.editing=null;ui.showNew=false;save();
  }
  if(k==='slot'){
    const all=fd.get('all')==='on',sts=fd.getAll('st');
    if(!all&&!sts.length){toast('Elegí al menos una alumna o marcá "Todas".');return}
    if(fd.get('end')<=fd.get('start')){toast('La hora de fin tiene que ser posterior a la de inicio.');return}
    state.slots.push({id:nid('c'),day:fd.get('day'),start:fd.get('start'),end:fd.get('end'),title:fd.get('title').trim(),all,students:all?[]:sts});
    const ids=all?active().map(s=>s.id):sts;notifyUpdate(ids,'calendario');save();
    toast(`Horario agregado. Aviso enviado a ${ids.length} ${ids.length===1?'alumna':'alumnas'}.`);
  }
  if(k==='password'){
    const cur=fd.get('current'),nx=fd.get('next'),cf=fd.get('confirm');
    const acc=session.role==='admin'?state.admin:stu(session.id);
    if(cur!==acc.pass){toast('La contraseña actual no es correcta.');return}
    if(nx.length<8){toast('La contraseña nueva tiene que tener al menos 8 caracteres.');return}
    if(nx!==cf){toast('Las dos contraseñas nuevas no coinciden.');return}
    if(nx===cur){toast('La contraseña nueva tiene que ser distinta de la actual.');return}
    acc.pass=nx;save();toast('Listo, tu contraseña se cambió. Usala la próxima vez que ingreses.');
  }
  if(k==='exercise'){
    const id=f.dataset.id,name=fd.get('name').trim();
    if(state.exercises.some(x=>x.name.trim().toLowerCase()===name.toLowerCase()&&x.id!==id)){toast('Ya hay un ejercicio con ese nombre.');return}
    const lines=v=>String(v||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const data={name,zone:fd.get('zone'),muscles:fd.get('muscles').trim(),equipment:fd.get('equipment').trim(),level:fd.get('level'),anim:fd.get('anim')||null,steps:lines(fd.get('steps')),mistakes:lines(fd.get('mistakes'))};
    let target;
    if(id){target=state.exercises.find(x=>x.id===id);const old=target.name;Object.assign(target,data);
      if(old!==name)Object.values(state.routines).forEach(r=>r.days.forEach(d=>d.exercises.forEach(x=>{if(x.name===old)x.name=name})))}
    else{target={id:nid('e'),...data,media:null};state.exercises.push(target)}
    if(ui.exMedia!==undefined)target.media=ui.exMedia;
    ui.exEdit=null;ui.exNew=false;ui.exMedia=undefined;
    try{localStorage.setItem(KEY,JSON.stringify(state));toast(id?'Ejercicio actualizado.':'Ejercicio agregado a la biblioteca.')}
    catch(err){target.media=null;save();toast('La animación no entra en el almacenamiento del prototipo. Se guardó el ejercicio sin ella; en la web final no hay este límite.')}
  }
  if(k==='payment'){
    const s=stu(fd.get('studentId'));const amount=+fd.get('amount')||s.fee;
    state.payments.push({id:nid('p'),studentId:s.id,amount,date:fd.get('date'),method:fd.get('method')});
    const paidDue=s.nextDue;s.nextDue=addMonth(s.nextDue);s.reminderSentFor=null;
    sendWA(s.id,'pago',`Hola ${first(s.name)}! Recibimos tu pago de ${money(amount)}. Tu próximo vencimiento es el ${fmtDateLong(s.nextDue)}. ¡Gracias!`);
    ui.gMonth=monthKey(fd.get('date'));save();toast(`Pago de ${first(s.name)} registrado. Próximo vencimiento: ${fmtDateLong(s.nextDue)}.`);
  }
  render();
});
render();
</script>

</body></html>
